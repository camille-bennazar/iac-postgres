name: Sécurité

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scans:
    name: Gitleaks et Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Vérifier les verrous avant installation
        run: python3 scripts/dependencies.py
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.15
          sha256: e3b186d4c70627f27037be615becaf4acfb30e41fb6a1819486717dc94e4e2a9
          install_args: --locked
          cache: false
      - name: Secrets, configurations et dépendances HIGH/CRITICAL
        id: scans
        run: make security SECURITY_FLAGS=--allow-known
      - name: Restaurer les notifications déjà envoyées
        if: >-
          !cancelled() &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/patch-watch-notifications.json
          key: patch-watch-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: patch-watch-v1-${{ github.repository_id }}-
      - name: Rechercher et rescanner les releases officielles stables
        id: watch
        if: >-
          !cancelled() &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/watch_patches.py check
      - name: Notifier le résultat de la veille sur Discord
        id: notify
        if: >-
          !cancelled() && steps.watch.outcome == 'success' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 scripts/watch_patches.py notify
      - name: Mémoriser les notifications envoyées
        if: >-
          !cancelled() && steps.notify.outcome == 'success' &&
          hashFiles('.cache/patch-watch-notifications.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/patch-watch-notifications.json
          key: patch-watch-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Bilan
        if: always()
        env:
          SCAN_RESULT: ${{ steps.scans.outcome }}
        run: |
          printf '### Sécurité\n\nRésultat : %s\n\nGitleaks : fichiers et historique Git. Trivy : configurations, Python, image PostgreSQL, provider et outils Go HIGH/CRITICAL.\n' "$SCAN_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .reports/security-summary.md ]; then
            cat .reports/security-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-reports
          path: .reports/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
